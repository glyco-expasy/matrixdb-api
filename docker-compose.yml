version: "2.4"
services:
  solr:
    image: solr:9
    container_name: solr
    ports:
      # bound to the host's loopback: Solr has no authentication and its admin can delete cores
      - "127.0.0.1:8983:8983"
    volumes:
      - solr-data:/var/solr
    restart: always
    networks:
      - matrixdb_network
  mongo:
    image: mongo:5.0
    ports:
      # loopback only: this MongoDB has no authentication (the API reaches it over the compose network)
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db
    restart: always
    networks:
      - matrixdb_network
  api:
    depends_on:
      - mongo
      - solr
    build: .
    ports:
      - 8000:8000
    restart: always
    networks:
      - matrixdb_network

volumes:
  mongo-data:
  solr-data:

networks:
  matrixdb_network: